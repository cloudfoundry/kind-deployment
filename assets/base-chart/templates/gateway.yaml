---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: blobstore
spec:
  parentRefs:
    - name: istio-gateway
  hostnames:
    - blobstore.{{ .Values.systemDomain }}
    - "*.blobstore.{{ .Values.systemDomain }}"
  rules:
    - backendRefs:
        - name: minio
          port: 9000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wildcard-gorouter
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: istio-gateway
  hostnames:
  - "*.{{ .Values.appsDomain }}"
  - "*.{{ .Values.systemDomain }}"
  rules:
    - backendRefs:
        - name: gorouter
          port: 443
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: ssh-proxy
spec:
  parentRefs:
    - name: istio-gateway
      sectionName: ssh-proxy
  rules:
    - backendRefs:
      - name: ssh-proxy
        port: 2222
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: gorouter-tls
spec:
  targetRefs:
    - kind: Service
      group: ""
      name: gorouter
  validation:
    hostname: gorouter
    caCertificateRefs:
      - kind: ConfigMap
        group: ""
        name: ca
{{- range $index := until 20 }}
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: cf-tcp-router-{{ add $index 1 }}
spec:
  parentRefs:
    - name: istio-gateway
      sectionName: tcp-route-{{ add $index 1 }}
  rules:
    - backendRefs:
      - name: cf-tcp-router
        port: {{ add 32000 $index }}
{{- end }}
