      - group: gateway.networking.k8s.io
        kind: TCPRoute
      namespaces:
        from: All
    name: syslog-binding-cache
    port: 9000
    protocol: TCP
  - allowedRoutes:
      kinds:
      - group: gateway.networking.k8s.io
        kind: TCPRoute
      namespaces:
        from: All
    name: tcp-route-1
    port: 32000
    protocol: TCP
  - allowedRoutes:
      kinds:
      - group: gateway.networking.k8s.io
        kind: TCPRoute
      namespaces:
        from: All
    name: tcp-route-2
    port: 32001
    protocol: TCP
  - allowedRoutes:
