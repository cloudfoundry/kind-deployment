    port: 32013
    protocol: TCP
    targetPort: 32013
  - appProtocol: tcp
    name: tcp-route-15
    port: 32014
    protocol: TCP
    targetPort: 32014
  - appProtocol: tcp
    name: tcp-route-16
    port: 32015
    protocol: TCP
    targetPort: 32015
  - appProtocol: tcp
    name: tcp-route-17
    port: 32016
    protocol: TCP
    targetPort: 32016
  - appProtocol: tcp
    name: tcp-route-18
    port: 32017
    protocol: TCP
    targetPort: 32017
  - appProtocol: tcp
    name: tcp-route-19
    port: 32018
    protocol: TCP
    targetPort: 32018
  - appProtocol: tcp
    name: tcp-route-20
    port: 32019
    protocol: TCP
    targetPort: 32019
  selector:
    gateway.networking.k8s.io/gateway-name: istio-gateway
  type: LoadBalancer
---
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: kind-settings
  namespace: {{ .Release.Namespace }}
spec:
  configPatches:
  - applyTo: CLUSTER
    match:
      cluster:
        name: outbound|443||gorouter.{{ .Release.Namespace }}.svc.cluster.local
      context: GATEWAY
    patch:
      operation: MERGE
      value:
        typed_extension_protocol_options:
          envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
            '@type': type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
            use_downstream_protocol_config:
              http2_protocol_options:
                max_inbound_window_update_frames_per_data_frame_sent: 10000
  workloadSelector:
    labels:
      gateway.networking.k8s.io/gateway-name: istio-gateway
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  annotations:
    networking.istio.io/service-type: LoadBalancer
  name: istio-gateway
  namespace: {{ .Release.Namespace }}
spec:
  gatewayClassName: istio
  listeners:
  - allowedRoutes:
      namespaces:
        from: All
    hostname: '*.{{ .Values.baseDomain }}'
    name: http
    port: 80
    protocol: HTTP
  - allowedRoutes:
      namespaces:
        from: All
    hostname: '*.{{ .Values.baseDomain }}'
    name: https
    port: 443
    protocol: HTTPS
    tls:
      certificateRefs:
      - group: ""
        kind: Secret
        name: all-in-one-tls
      mode: Terminate
  - allowedRoutes:
      kinds:
      - group: gateway.networking.k8s.io
        kind: TCPRoute
      namespaces:
        from: All
    name: log-cache-api
    port: 8080
    protocol: TCP
  - allowedRoutes:
      kinds:
      - group: gateway.networking.k8s.io
        kind: TCPRoute
      namespaces:
        from: All
    name: log-cache-syslog
    port: 8082
    protocol: TCP
  - allowedRoutes:
      kinds:
      - group: gateway.networking.k8s.io
        kind: TCPRoute
      namespaces:
        from: All
    name: doppler
    port: 8083
    protocol: TCP
  - allowedRoutes:
      kinds:
      - group: gateway.networking.k8s.io
        kind: TCPRoute
      namespaces:
        from: All
