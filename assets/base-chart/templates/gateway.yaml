    name: tcp-route-2
    port: 32001
    protocol: TCP
    targetPort: 32001
  - appProtocol: tcp
    name: tcp-route-3
    port: 32002
    protocol: TCP
    targetPort: 32002
  - appProtocol: tcp
    name: tcp-route-4
    port: 32003
    protocol: TCP
    targetPort: 32003
  - appProtocol: tcp
    name: tcp-route-5
    port: 32004
    protocol: TCP
    targetPort: 32004
  - appProtocol: tcp
    name: tcp-route-6
    port: 32005
    protocol: TCP
    targetPort: 32005
