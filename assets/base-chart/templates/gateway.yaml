    networking.istio.io/service-type: LoadBalancer
    dns.gardener.cloud/class: garden
    dns.gardener.cloud/dnsnames: "*.{{ .Values.systemDomain }},*.{{ .Values.appsDomain }}"
  labels:
    gateway.istio.io/managed: istio.io-gateway-controller
    gateway.networking.k8s.io/gateway-name: istio-gateway
  name: istio-gateway-istio
  namespace: {{ .Release.Namespace }}
spec:
  externalTrafficPolicy: Cluster
  internalTrafficPolicy: Cluster
  ports:
  - appProtocol: tcp
    name: status-port
    port: 15021
    protocol: TCP
    targetPort: 15021
  - appProtocol: tcp
    name: policy-server
    port: 4003
    protocol: TCP
    targetPort: 4003
  - appProtocol: tcp
    name: service-discovery-controller
    port: 8054
    protocol: TCP
    targetPort: 8054
  - appProtocol: http
    name: http
    port: 80
    protocol: TCP
    targetPort: 80
  - appProtocol: https
    name: https
    port: 443
    protocol: TCP
    targetPort: 443
  - appProtocol: tcp
    name: log-cache-api
    port: 8080
    protocol: TCP
    targetPort: 8080
  - appProtocol: tcp
    name: log-cache-syslog
    port: 8082
    protocol: TCP
    targetPort: 8082
  - appProtocol: tcp
    name: doppler
    port: 8083
    protocol: TCP
    targetPort: 8083
  - appProtocol: tcp
    name: ssh-proxy
    port: 2222
    protocol: TCP
    targetPort: 2222
  - appProtocol: tcp
    name: syslog-binding-cache
    port: 9000
    protocol: TCP
    targetPort: 9000
  - appProtocol: tcp
    name: tcp-route-1
    port: 32000
    protocol: TCP
    targetPort: 32000
