[[processors.override]]
  name_prefix = "cc-api."

[[inputs.prometheus]]
  urls = ["unix:///var/run/cloud_controller_metrics.sock?path=/internal/v4/metrics"]

[[inputs.http]]
  urls = [ "http://localhost:9022/healthz" ]
  data_format = "value"
  data_type = "string"
  name_override = "http_api_healthz"

[[outputs.file]]
  files = ["stdout"]
  data_format = "influx"