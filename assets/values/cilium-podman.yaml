ipam:
  mode: kubernetes
envoy:
  enabled: false
# kube-proxy replacement via eBPF requires privileges not available in
# rootful Podman containers running in CI. Fall back to standard kube-proxy mode.
kubeProxyReplacement: false
k8sServiceHost: cfk8s-control-plane
k8sServicePort: 6443
operator:
  replicas: 1
routingMode: tunnel
tunnelProtocol: vxlan
# Disable all eBPF features that require CAP_BPF / kernel privileges
# not available inside rootful Podman-spawned KinD nodes.
bpf:
  masquerade: false
  autoMount:
    enabled: false
  preallocateMaps: false
hostServices:
  enabled: false
nodePort:
  enabled: false
socketLB:
  enabled: false
externalIPs:
  enabled: false
hubble:
  enabled: false
# Tell Cilium where the cgroup root is (since we can't auto-mount)
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
bandwidthManager:
  enabled: false
localRedirectPolicy: false
enableIPv4Masquerade: true
loadBalancer:
  mode: snat
sysctlfix:
  enabled: false
hostFirewall:
  enabled: false
sessionAffinity: false
enableEnvoyConfig: false
